# Payload on a single small VM: Postgres + Payload (Next standalone) + Caddy for HTTPS.
# Everything uses host networking: the Vercel Postgres adapter only talks plain `pg` to
# localhost/127.0.0.1, and Postgres stays bound to loopback.
# Run from the repo root: docker compose -f deploy/vm/docker-compose.yml up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: always
    network_mode: host
    command: ['postgres', '-c', 'listen_addresses=127.0.0.1', '-c', 'shared_buffers=128MB']
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: payload
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'payload']
      interval: 5s
      retries: 20

  app:
    build:
      context: ../..
      network: host
    restart: always
    network_mode: host
    env_file: ../../.env
    environment:
      NODE_OPTIONS: --max-old-space-size=768
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: always
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
